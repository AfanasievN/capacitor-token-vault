name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library checks (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: matrix.node == 24
        run: npm pack --dry-run

  dependency-budget:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Assert the production dependency tree is empty
        shell: bash
        run: |
          tree="$(npm ls --omit=dev --all --parseable | tail -n +2)"
          if [ -n "$tree" ]; then
            echo "Unexpected runtime dependencies:"
            echo "$tree"
            exit 1
          fi
          echo "Production dependency tree is empty."

  android:
    name: Android native build and test compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Compile library, instrumented tests, and lint
        run: ./android/gradlew -p android assembleDebug assembleDebugAndroidTest lintDebug --no-daemon

  ios:
    name: iOS native build and ownership tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Compile plugin for iOS Simulator
        run: >-
          xcodebuild build
          -scheme CapacitorTokenVault
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Test installation ownership logic
        shell: bash
        run: |
          destination_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')"
          test -n "$destination_id"
          xcodebuild test \
            -scheme CapacitorTokenVault \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -only-testing:TokenVaultPluginTests/InstallationOwnershipTests
