# Web layer + contract on every push; the native suites need a device, so they run on the
# mobile runners (macOS for iOS, an emulator for Android) and stay manual until this
# library has its own emulator capacity.
stages:
  - verify
  - native

default:
  tags:
    - k8s
    - dev
  interruptible: true

'verify:web':
  stage: verify
  image: node:22
  script:
    - npm ci
    - npm run verify

'verify:ios':
  stage: native
  tags:
    - macos_shell
    - mobile_app_shell
  script:
    # Hits the real Keychain: asserts accessibility + synchronizable attributes.
    - swift test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

'verify:android':
  stage: native
  tags:
    - macos_shell
    - mobile_app_shell
  script:
    # AndroidKeyStore has no JVM implementation — the suite is instrumented and needs a
    # booted emulator, which is why this job is manual until capacity exists.
    - echo "run ./gradlew connectedAndroidTest from a consumer app (see README)"
    - exit 1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
